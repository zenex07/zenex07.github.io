name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub Pages ignores the artifact uploaded above unless the repository's
      # Pages source is set to "GitHub Actions". If it is still "Deploy from a
      # branch", Pages publishes the raw branch instead: index.html points at
      # /src/main.jsx, the browser receives uncompiled JSX, and the site renders
      # blank. This checks the setting and only attempts a fix when it is wrong.
      - name: Ensure Pages publishes the Actions artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          current=$(gh api "repos/$repo/pages" --jq '.build_type' 2>/dev/null || echo "unknown")
          if [ "$current" = "workflow" ]; then
            echo "Pages source is GitHub Actions - the artifact will be published."
            exit 0
          fi
          echo "Pages source is '$current', not 'workflow'. Trying to correct it..."
          if printf '%s' '{"build_type":"workflow"}' \
               | gh api -X PUT "repos/$repo/pages" --input - >/dev/null 2>&1; then
            echo "Corrected. Pages will now publish the Actions artifact."
          else
            echo "::warning::Pages source is '$current' and could not be changed automatically."
            echo "::warning::Set it once by hand: Settings -> Pages -> Source -> GitHub Actions."
          fi

      - id: deployment
        uses: actions/deploy-pages@v4
